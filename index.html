<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voluntari GO</title>
<style>
:root{--ink:#14201A;--mut:#4A5650;--bg:#F6F7F4;--line:#DDE2DB;--mag:#C2107F;--ora:#D95900;--tint:#FBE6D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.stripe{height:6px;background:linear-gradient(90deg,#E61794 50%,#D95900 50%)}
#app{max-width:560px;margin:0 auto;padding:0 0 84px}
h1{font-size:22px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 10px}
.top button{background:none;border:0;color:var(--mag);font:600 14px system-ui,-apple-system,sans-serif;min-height:44px;cursor:pointer}
.card {
  margin: 0 16px 12px;
  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.05);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); /* Umbră fină modernă */
  transition: transform 0.2s ease, box-shadow 0.2s ease; /* Animație fină */
}
.card.go:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
}
.m{font-size:14px;color:var(--mut);margin:4px 0 0}
.bar{height:8px;border-radius:4px;background:#E3E8E1;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ora)}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--tint);color:#8A3A00;display:inline-block;margin-top:6px}
.tag.g{background:#ECEAE6;color:#4A4540}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(100% - 32px);
  min-height: 48px;
  margin: 0 16px 10px;
  border-radius: 14px;
  border: 1.5px solid var(--mag);
  background: var(--mag);
  color: #fff;
  font: 600 16px system-ui, -apple-system, sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(194, 16, 127, 0.2); /* Umbră colorată după buton */
  transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}
.btn:active {
  transform: scale(0.98);
}
.btn.o {
  background: #fff;
  color: var(--mag);
  box-shadow: none;
}
.btn:disabled{opacity:.5}
label{font-size:14px;font-weight:600}
input[type=text],input[type=email]{width:100%;min-height:48px;border:1px solid #B9C2B7;border-radius:10px;padding:0 12px;font:16px system-ui,-apple-system,sans-serif;margin:4px 0 12px;background:#fff}
.r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EEF1EC;font-size:14px}
.r:last-child{border:0}.r span:first-child{color:var(--mut)}.r span:last-child{text-align:right}
a{color:var(--mag)}
.s{margin:14px 20px 6px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.back{background:none;border:0;color:var(--mag);font:600 15px system-ui,-apple-system,sans-serif;padding:14px 16px 0;min-height:44px;cursor:pointer}
.poster{width:100%;display:block;max-height:420px;object-fit:contain;background:#E3E8E1}
.offer{background:var(--tint);border-color:#F2C19B}
.x{background:#FBE9EC;border-color:#E3B4BE}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line)}
.nav button{flex:1;min-height:52px;border:0;background:none;font:600 14px system-ui,-apple-system,sans-serif;color:var(--mut);cursor:pointer}
.nav button.on{color:var(--mag)}
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 99; padding: 16px; backdrop-filter: blur(4px); }
.modal-card { background: #fff; width: 100%; max-width: 360px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
.skeleton { background: #E3E8E1; border-radius: 16px; height: 110px; margin: 0 16px 12px; animation: pulse 1.5s infinite ease-in-out; }
.bell-btn{position:relative;background:none;border:none;cursor:pointer;font-size:22px;padding:6px;display:flex;align-items:center}
.bell-badge{position:absolute;top:2px;right:2px;background:var(--mag);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 6px;min-width:18px;text-align:center}
.notif-drawer{position:fixed;top:0;right:-340px;width:320px;height:100vh;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,0.15);z-index:99;transition:right 0.3s ease;display:flex;flex-direction:column;padding:16px}
.notif-drawer.open{right:0}
.notif-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.notif-item{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;position:relative}
.notif-item.unread{border-left:4px solid var(--mag)}
.notif-time{font-size:11px;color:var(--mut);margin-top:4px}
.notif-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:98;display:none;backdrop-filter:blur(2px)}
.notif-overlay.open{display:block}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:0 0 14px;font-size:14px}
.chk input{margin-top:3px;width:20px;height:20px}
</style>
</head>
<body>
<div class="stripe"></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient('https://sdhhzptvbkmeazrqkncw.supabase.co', 'sb_publishable_adna1O2TC3b99dIjxlU9Rw_SLvo8GYR');
const S = { cool: 0, last: null, notes: [], session: null, me: null, events: [], mine: {}, view: 'list', tab: 'all', q: '', modal: null, loading: true, id: null, roster: [], mode: 'register', step: 'form', email: '' };
const $ = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Europe/Bucharest';
const fD = d => new Intl.DateTimeFormat('ro-RO', { weekday: 'long', day: 'numeric', month: 'long', timeZone: TZ }).format(new Date(d));
const fT = d => new Intl.DateTimeFormat('ro-RO', { hour: '2-digit', minute: '2-digit', timeZone: TZ }).format(new Date(d));

function toast(m) {
  console.log('Toast:', m);
}

async function load() {
  if (!S.session) return render();
  S.loading = true;
  render();
  await db.rpc('refresh_offers');
  const [ev, su, me, nt] = await Promise.all([
    db.from('events').select('*').gt('ends_at', new Date().toISOString()).order('starts_at'),
    db.from('signups').select('event_id,status,offer_expires_at'),
    S.me ? { data: S.me } : db.from('profiles').select('first_name,last_name,is_admin').eq('id', S.session.user.id).maybeSingle(),
    db.from('notifications').select('id,message').is('read_at', null).order('created_at', { ascending: false })
  ]);
  S.events = ev.data || [];
  S.mine = Object.fromEntries((su.data || []).map(r => [r.event_id, r]));
  S.me = me.data || S.me;
  
  const newNotes = nt.data || [];

  S.notes = newNotes;
  S.loading = false;

if (S.view === 'detail') {
    const r = await db.rpc('event_roster', { p_event: S.id });
    S.roster = r.data || [];
  }
  
  updateBadge(); // <-- Aici verifică și aprinde bulina roșie când se încarcă pagina
  render();
}

function render() {
    if (!S.session) { $.innerHTML = authView() + '<p class="m" style="text-align:center;margin-top:24px;font-size:12px">Versiune 3</p>'; cooldown(); return; }
    let html = S.view === 'detail' ? detailView() : listView();
    
    // Dacă este activat modalul de confirmare, îl adăugăm peste ecran
    if (S.modal === 'leave') {
      html += `<div class="modal-overlay">
        <div class="modal-card">
          <h3 style="margin-top:0; font-size:18px;">Sigur vrei să renunți?</h3>
          <p class="m" style="margin-bottom:20px;">Vei fi șters de la acest eveniment.</p>
          <div style="display: flex; gap: 10px;">
            <button class="btn o" data-a="close-modal" style="margin:0; flex:1;">Înapoi</button>
            <button class="btn" data-a="do-leave" style="margin:0; flex:1;">Da, renunț</button>
          </div>
        </div>
      </div>`;
    }
    
    $.innerHTML = html;
  }

function authView() {
  const reg = S.mode === 'register';
  if (S.step === 'code') return `<div class="top"><h1>Confirmă emailul</h1></div>
  <div class="card"><p class="m" style="margin:0 0 12px">Am trimis un email la <b>${esc(S.email)}</b>. Apasă pe butonul din email sau scrie aici codul primit.</p>
  <form data-f="code"><label for="c">Cod din email</label><input type="text" id="c" inputmode="numeric" autocomplete="one-time-code">
  <button class="btn" style="margin:0;width:100%">Intră</button></form></div>
  <button class="btn o" id="rs" data-a="resend" style="margin:0 16px 10px" disabled>Trimite din nou emailul</button>
  <p class="m" style="margin:0 20px">Dacă ai primit mai multe emailuri, folosește codul din cel mai recent.</p>
  <button class="back" data-a="back-auth">Înapoi</button>`;
  return `<div class="top"><h1>${reg ? 'Creare cont voluntar' : 'Intră în cont'}</h1></div>
  <p class="m" style="margin:0 20px 14px">${reg ? 'Completezi o singură dată. Îți trimitem un email de confirmare, apoi rămâi conectat.' : 'Scrie emailul cu care te-ai înregistrat.'}</p>
  <form data-f="auth"><div class="card">
  ${reg ? `<label for="fn">Prenume</label><input type="text" id="fn" autocomplete="given-name" required>
  <label for="ln">Nume</label><input type="text" id="ln" autocomplete="family-name" required>` : ''}
  <label for="em">Email</label><input type="email" id="em" autocomplete="email" required></div>
  ${reg ? `<label class="chk" style="margin:0 20px 14px"><input type="checkbox" id="ok" required><span>Sunt de acord să apar ca „Prenume I.” în listele de înscriși, vizibile celorlalți voluntari.</span></label>` : ''}
  <button class="btn">${reg ? 'Trimite linkul de confirmare' : 'Trimite linkul de intrare'}</button></form>
  <p class="m" style="margin:6px 20px"><a href="#" data-a="mode">${reg ? 'Ai deja cont? Intră' : 'Nu ai cont? Creează unul'}</a></p>`;
}

function pageTop(t) {
  return `<div class="top">
    <h1>${t}</h1>
    <span style="display:flex;align-items:center;gap:8px;">
      <button class="bell-btn" id="bell-btn" aria-label="Notificări" style="position:relative;">
        🔔<span id="notif-badge" style="display:none; position:absolute; top:2px; right:2px; width:9px; height:9px; background:#ef4444; border-radius:50%; border:2px solid #fff;"></span>
      </button>
      ${S.me && S.me.is_admin ? '<a href="admin.html" style="font-size:14px;font-weight:600;margin-right:6px">Admin</a>' : ''}
      <button data-a="out">Ieși${S.me ? ' (' + esc(S.me.first_name) + ')' : ''}</button>
    </span>
  </div>`;
}

function listView() {
  const searchBox = `<div style="margin: 0 16px 12px;">
    <input type="text" id="search-events" placeholder="🔍 Caută eveniment sau locație..." value="${esc(S.q)}" style="margin:0; background:#fff;">
  </div>`;
  
  if (S.loading) {
    return pageTop('Evenimente') + searchBox + '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>' +
      `<nav class="nav"><button data-a="tab" data-t="all" class="${S.tab === 'all' ? 'on' : ''}">Evenimente</button><button data-a="tab" data-t="mine" class="${S.tab === 'mine' ? 'on' : ''}">Evenimentele mele</button></nav>`;
  }

  let vis = S.events.filter(e => e.status === 'active' || S.mine[e.id]);
  if (S.tab === 'mine') vis = vis.filter(e => S.mine[e.id]);
  
  if (S.q) {
    const query = S.q.toLowerCase();
    vis = vis.filter(e => (e.title && e.title.toLowerCase().includes(query)) || (e.location && e.location.toLowerCase().includes(query)));
  }

  const cards = vis.map(e => {
    const taken = e.confirmed_count + e.offered_count, m = S.mine[e.id];
    const tag = e.status === 'cancelled' ? '<span class="tag g">Anulat</span>' : m ? (m.status === 'confirmed' ? '<span class="tag">Ești înscris</span>' : m.status === 'offered' ? '<span class="tag">Ai un loc rezervat: confirmă</span>' : '<span class="tag">Ești pe lista de așteptare</span>')
      : taken >= e.capacity ? `<span class="tag g">Complet · ${e.waitlist_count} în așteptare</span>` : '';
    return `<div class="card go${e.status === 'cancelled' ? ' x' : ''}" data-a="open" data-id="${e.id}"><b style="font-size:17px">${esc(e.title)}</b>
    <p class="m">${esc(fD(e.starts_at))} · ${fT(e.starts_at)}–${fT(e.ends_at)} · ${esc(e.location)}</p>
    <div class="bar"><i style="width:${Math.min(100, taken / e.capacity * 100)}%"></i></div>
    <p class="m" style="margin:0">${taken} din ${e.capacity} locuri ocupate</p>${tag}</div>`;
  }).join('');

  return pageTop('Evenimente') + searchBox + (cards || `<div class="card"><p class="m">${S.q ? 'Nu am găsit niciun eveniment pentru căutarea ta.' : S.tab === 'mine' ? 'Nu ești înscris la niciun eveniment.' : 'Momentan nu sunt evenimente.'}</p></div>`) +
  `<nav class="nav"><button data-a="tab" data-t="all" class="${S.tab === 'all' ? 'on' : ''}">Evenimente</button><button data-a="tab" data-t="mine" class="${S.tab === 'mine' ? 'on' : ''}">Evenimentele mele</button></nav>`;
}

function phoneLinks(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  const wa = d.startsWith('0') ? '4' + d : d;
  return ` · <a href="tel:+${wa}">Sună</a> · <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`;
}

function detailView() {
  const e = S.events.find(x => x.id === S.id);
  if (!e) return `<button class="back" data-a="back">‹ Înapoi</button><div class="card"><p class="m">Evenimentul nu mai este disponibil.</p></div>`;
  const m = S.mine[e.id], taken = e.confirmed_count + e.offered_count, free = e.capacity - taken;
  const conf = S.roster.filter(r => r.status === 'confirmed'), wait = S.roster.filter(r => r.status !== 'confirmed');
  const me = S.roster.find(r => r.is_me);
  let act;
  if (e.status === 'cancelled') act = `<div class="card x"><b>Evenimentul a fost anulat</b></div>` + (m ? '<button class="btn o" data-a="leave">Elimină din lista mea</button>' : '');
  else if (m && m.status === 'offered') act = `<div class="card offer"><b>S-a eliberat un loc</b><p class="m" style="color:var(--ink)">Locul e rezervat pentru tine până la ${fT(m.offer_expires_at)} (${esc(fD(m.offer_expires_at))}). Dacă nu confirmi, trece la următorul din listă.</p></div>
    <button class="btn" data-a="accept">Confirm participarea</button><button class="btn o" data-a="leave">Renunț la loc</button>`;
  else if (m) act = `<div class="card"><b>${m.status === 'confirmed' ? 'Ești înscris ca voluntar' : 'Ești pe lista de așteptare' + (me ? ', poziția ' + me.position : '')}</b></div><button class="btn o" data-a="leave">Anulează înscrierea</button>`;
  else act = `<button class="btn" data-a="join">${free > 0 && e.waitlist_count === 0 ? 'Mă înscriu ca voluntar' : 'Intru pe lista de așteptare'}</button>`;
  return `<button class="back" data-a="back">‹ Înapoi</button>
  ${e.poster_url ? `<a href="${esc(e.poster_url)}" target="_blank" rel="noopener"><img class="poster" src="${esc(e.poster_url)}" alt="Afiș ${esc(e.title)}"></a><p class="m" style="margin:4px 20px 0">Atinge afișul pentru a-l deschide mare.</p>` : ''}
  <div class="top"><h1>${esc(e.title)}</h1></div>
  <div class="card"><div class="r"><span>Data</span><span>${esc(fD(e.starts_at))}</span></div>
  <div class="r"><span>Eveniment</span><span>${fT(e.starts_at)}–${fT(e.ends_at)}</span></div>
  ${e.meet_at || e.meeting_point ? `<div class="r"><span>Întâlnire</span><span>${e.meet_at ? fT(e.meet_at) : ''} ${esc(e.meeting_point || '')}</span></div>` : ''}
  <div class="r"><span>Locație</span><span>${esc(e.location)}${e.map_url ? ` · <a href="${esc(e.map_url)}" target="_blank" rel="noopener">Hartă</a>` : ''}</span></div>
  ${e.contact_name ? `<div class="r"><span>Contact</span><span>${esc(e.contact_name)}${phoneLinks(e.contact_phone)}</span></div>` : ''}</div>
  ${e.description ? `<p class="m" style="margin:0 20px 14px">${esc(e.description)}</p>` : ''}
  <div class="card"><b>${taken} din ${e.capacity} locuri ocupate</b><div class="bar"><i style="width:${Math.min(100, taken / e.capacity * 100)}%"></i></div><p class="m" style="margin:0">${free > 0 ? free + ' locuri libere' : 'Complet'}</p></div>
  ${act}
  <div class="s">Înscriși (${conf.length})</div><div class="card">${conf.map(r => `<div class="r"><span>${esc(r.display_name)}${r.is_me ? ' (tu)' : ''}</span></div>`).join('') || '<p class="m">Nimeni încă.</p>'}</div>
  <div class="s">Listă de așteptare (${wait.length})</div><div class="card">${wait.map((r, i) => `<div class="r"><span>${i + 1}. ${esc(r.display_name)}${r.is_me ? ' (tu)' : ''}</span><span>${r.status === 'offered' ? 'loc rezervat' : ''}</span></div>`).join('') || '<p class="m">Nimeni în așteptare.</p>'}</div>`;
}

async function run(fn, args) {
  const { error } = await db.rpc(fn, args);
  if (error) toast(error.message);
  await load();
}
document.addEventListener('input', ev => {
  if (ev.target && ev.target.id === 'search-events') {
    S.q = ev.target.value;
    render();
    const input = document.getElementById('search-events');
    if (input) { input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
  }
});
  
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'mode') { ev.preventDefault(); S.mode = S.mode === 'register' ? 'login' : 'register'; render(); }
  else if (a === 'resend') {
    if (busy || !S.last) return; busy = true; el.disabled = true; el.textContent = 'Se trimite…';
    const err = await sendCode(...S.last); busy = false;
    if (err) toast(msgOf(err, true)); else { S.cool = Date.now() + 60000; toast('Am trimis un email nou.'); }
    cooldown();
  }
  else if (a === 'back-auth') { S.step = 'form'; render(); }
  else if (a === 'out') { await db.auth.signOut(); }
  else if (a === 'tab') { S.tab = el.dataset.t; render(); }
  else if (a === 'open') { S.view = 'detail'; S.id = el.dataset.id; S.roster = []; render(); load(); }
  else if (a === 'seen') { await db.rpc('mark_notifications_read'); load(); }
  else if (a === 'back') { S.view = 'list'; render(); }
  else if (a === 'join') await run('join_event', { p_event: S.id });
  else if (a === 'accept') await run('accept_offer', { p_event: S.id });
  else if (a === 'leave') { S.modal = 'leave'; render(); }
  else if (a === 'close-modal') { S.modal = null; render(); }
  else if (a === 'do-leave') { S.modal = null; await run('leave_event', { p_event: S.id }); }
});

let busy = false;
const msgOf = (e, reg) => (e.status === 429 || /rate|seconds/i.test(e.message || e.code || '')) ? 'Ai cerut deja un email. Mai așteaptă un minut și încearcă din nou.'
  : (!reg && /not allowed|signups/i.test(e.message || '')) ? 'Nu există un cont cu acest email. Creează un cont nou.'
  : 'Nu am putut trimite emailul: ' + (e.message || e.code || 'eroare necunoscută');
async function sendCode(email, reg, meta) {
  const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: reg, data: reg ? meta : undefined, emailRedirectTo: location.origin + location.pathname } });
  return error;
}
function cooldown() {
  const b = document.getElementById('rs'); if (!b || busy) return;
  const left = Math.ceil((S.cool - Date.now()) / 1000);
  b.disabled = left > 0; b.textContent = left > 0 ? `Poți cere un email nou în ${left} s` : 'Trimite din nou emailul';
}
setInterval(cooldown, 1000);

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target.dataset.f, v = id => (document.getElementById(id)?.value || '').trim();
  const btn = ev.target.querySelector('button');
  if (busy || btn.disabled) return;
  if (f === 'auth') {
    busy = true; const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Se trimite emailul…';
    const reg = S.mode === 'register', email = v('em').toLowerCase(), meta = { first_name: v('fn'), last_name: v('ln') };
    const err = await sendCode(email, reg, meta); busy = false;
    if (err) { btn.disabled = false; btn.textContent = txt; return toast(msgOf(err, reg)); }
    S.last = [email, reg, meta]; S.cool = Date.now() + 60000; S.email = email; S.step = 'code'; render();
  } else if (f === 'code') {
    busy = true; btn.disabled = true; btn.textContent = 'Se verifică…';
    let error;
    for (const type of ['email', 'signup', 'magiclink']) {
      ({ error } = await db.auth.verifyOtp({ email: S.email, token: v('c').replace(/\s+/g, ''), type }));
      if (!error) break;
    }
    busy = false;
    if (error) { btn.disabled = false; btn.textContent = 'Intră'; console.warn('verifyOtp', error); const why = (error.message && error.message !== '{}' ? error.message : '') || error.code || error.status || 'fără detalii'; toast('Cod respins (' + why + '). Folosește codul din cel mai recent email.'); }
  }
});

let t;
const later = () => { clearTimeout(t); t = setTimeout(load, 300); };
db.auth.onAuthStateChange((_e, session) => {
  S.session = session; if (!session) { S.me = null; S.view = 'list'; S.step = 'form'; }
  load();
});
db.channel('live').on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, later)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'signups' }, later).subscribe();

let notifications = [];

db.channel('notif-realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, payload => {
  notifications.unshift(payload.new);
  renderNotifications();
  updateBadge(); // <-- Asta aprinde bulina roșie instant
}).subscribe();

async function loadNotifications() {
  const { data } = await db.from('notifications').select('*').order('created_at', { ascending: false }).limit(20);
  notifications = data || [];
  renderNotifications();
}

function renderNotifications() {
  const badge = document.getElementById('bell-badge');
  const list = document.getElementById('notif-list');
  if (!badge || !list) return;

  const readIds = JSON.parse(localStorage.getItem('read_notifs') || '[]');
  const unreadCount = notifications.filter(n => !readIds.includes(n.id)).length;
  
  if (unreadCount > 0) {
    badge.textContent = unreadCount;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  if (notifications.length === 0) {
    list.innerHTML = '<p class="m">Nu ai nicio notificare.</p>';
    return;
  }

  list.innerHTML = notifications.map(n => {
    const isUnread = !readIds.includes(n.id);
    const dateStr = new Date(n.created_at).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
    return `<div class="notif-item${isUnread ? ' unread' : ''}">
      <div>${esc(n.message)}</div>
      <div class="notif-time">${dateStr}</div>
    </div>`;
  }).join('');
}

document.addEventListener('click', e => {
  const drawer = document.getElementById('notif-drawer');
  const overlay = document.getElementById('notif-overlay');
  
  if (e.target.closest('#btn-bell')) {
    drawer.classList.add('open');
    overlay.classList.add('open');
    localStorage.setItem('read_notifs', JSON.stringify(notifications.map(n => n.id)));
    renderNotifications();
  }
  
  if (e.target.closest('#close-notif') || e.target.id === 'notif-overlay') {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
  }
});

db.channel('notif-realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, payload => {
  notifications.unshift(payload.new);
  renderNotifications();
}).subscribe();

// Actualizează vizibilitatea bulinei roșii
function updateBadge() {
  const badge = document.getElementById('notif-badge');
  if (!badge) return;
  
  const notesList = S.notes || [];
  const deletedIds = JSON.parse(localStorage.getItem('deleted_notifs') || '[]');
  const validNotes = notesList.filter(n => !deletedIds.includes(n.id));

  if (validNotes.length === 0) {
    badge.style.display = 'none';
    return;
  }

  const lastReadId = localStorage.getItem('last_read_notif_id');
  const latestNoteId = validNotes[0].id;
  const hasUnread = !lastReadId || lastReadId !== latestNoteId;
  
  badge.style.display = hasUnread ? 'block' : 'none';
}

// Șterge toate notificările local
function clearAllNotifications() {
  if (!confirm('Sigur vrei să ștergi toate notificările?')) return;
  
  const allIds = (S.notes || []).map(n => n.id);
  localStorage.setItem('deleted_notifs', JSON.stringify(allIds));
  
  if (S.notes && S.notes.length > 0) {
    localStorage.setItem('last_read_notif_id', S.notes[0].id);
  }
  
  const badge = document.getElementById('notif-badge');
  if (badge) badge.style.display = 'none';
  
  openNotifDrawer();
}

// Funcție ajutătoare pentru a afișa data în siguranță
function formatNotificationDate(dateString) {
  if (!dateString) return '';
  const d = new Date(dateString);
  return isNaN(d.getTime()) ? '' : d.toLocaleString('ro-RO');
}

// Funcție care randează lista în sertar și îl deschide
function openNotifDrawer() {
  const drawer = document.getElementById('notif-drawer');
  const overlay = document.getElementById('notif-overlay');
  const list = document.getElementById('notif-list');
  
  if (list) {
    const deletedIds = JSON.parse(localStorage.getItem('deleted_notifs') || '[]');
    const notesList = (S.notes || []).filter(n => !deletedIds.includes(n.id));

    if (notesList.length === 0) {
      list.innerHTML = `
        <div style="padding:8px 16px; background:#f9f9f9; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; color:#666;">Istoric notificări</span>
        </div>
        <p class="m" style="padding:20px;text-align:center;color:#666;">Momentan nu ai nicio notificare.</p>
      `;
    } else {
      const lastReadId = localStorage.getItem('last_read_notif_id');

      let html = `
        <div style="padding:8px 16px; background:#f9f9f9; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; color:#666;">Istoric notificări</span>
          <button onclick="clearAllNotifications()" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer; padding:4px;">Șterge tot</button>
        </div>
      `;

      html += notesList.map((n, index) => {
        const isUnread = index === 0 && (!lastReadId || lastReadId !== n.id);
        const bgStyle = isUnread ? 'background: #f0f7ff; border-left: 3px solid #3b82f6;' : 'background: #fff;';
        
        // Verificăm ce proprietate conține data (created_at, date, inserted_at etc.)
        const rawDate = n.created_at || n.date || n.inserted_at || n.time;
        const formattedDate = formatNotificationDate(rawDate);
        
        return `
          <div style="padding:12px 16px; border-bottom:1px solid #f0f0f0; font-size:14px; ${bgStyle}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div style="${isUnread ? 'font-weight:600; color:#1e3a8a;' : 'color:#333;'}">${typeof esc === 'function' ? esc(n.message) : n.message}</div>
              ${isUnread ? '<span style="width:6px; height:6px; background:#3b82f6; border-radius:50%; display:inline-block; margin-top:6px; flex-shrink:0;"></span>' : ''}
            </div>
            ${formattedDate ? `<div style="font-size:11px; color:#888; margin-top:4px;">${formattedDate}</div>` : ''}
          </div>
        `;
      }).join('');

      list.innerHTML = html;
    }
  }

  if (drawer) drawer.classList.add('open');
  if (overlay) overlay.classList.add('open');

  const notesList = S.notes || [];
  const deletedIds = JSON.parse(localStorage.getItem('deleted_notifs') || '[]');
  const validNotes = notesList.filter(n => !deletedIds.includes(n.id));

  if (validNotes.length > 0) {
    localStorage.setItem('last_read_notif_id', validNotes[0].id);
  }
  updateBadge();
}

// Funcție care închide sertarul
function closeNotifDrawer() {
  const drawer = document.getElementById('notif-drawer');
  const overlay = document.getElementById('notif-overlay');
  if (drawer) drawer.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
}

// Ascultători pentru click pe clopoțel, închidere și overlay
document.addEventListener('click', ev => {
  if (ev.target.closest('#bell-btn')) {
    openNotifDrawer();
  }
  if (ev.target.closest('#close-notif') || ev.target.id === 'notif-overlay') {
    closeNotifDrawer();
  }
});

setTimeout(updateBadge, 500);
</script>
<div class="notif-overlay" id="notif-overlay"></div>
<aside class="notif-drawer" id="notif-drawer">
  <div class="notif-header" style="display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #eee;">
    <h3 style="margin:0;font-size:18px">Notificări</h3>
    <button class="sm" id="close-notif" style="min-height:32px;padding:0 8px">✕ Închide</button>
  </div>
  <div id="notif-list" style="overflow-y:auto;flex:1">
    <p class="m" style="padding:20px;text-align:center;color:#666;">Se încarcă notificările...</p>
  </div>
</aside>
</body>
</html>
