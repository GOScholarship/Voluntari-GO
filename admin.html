<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Voluntari GO</title>
<style>
:root{--ink:#14201A;--mut:#4A5650;--bg:#F6F7F4;--line:#DDE2DB;--mag:#C2107F;--ora:#D95900;--tint:#FBE6D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.stripe{height:6px;background:linear-gradient(90deg,#E61794 50%,#D95900 50%)}
#app{max-width:600px;margin:0 auto;padding:0 0 60px}
h1{font-size:22px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 10px;gap:8px}
.card{margin:0 16px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.go{cursor:pointer}
.m{font-size:14px;color:var(--mut);margin:4px 0 0}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--tint);color:#8A3A00;display:inline-block;margin:6px 6px 0 0}
.tag.g{background:#ECEAE6;color:#4A4540}
.btn{display:flex;align-items:center;justify-content:center;width:calc(100% - 32px);min-height:48px;margin:0 16px 10px;border-radius:12px;border:1.5px solid var(--mag);background:var(--mag);color:#fff;font:600 16px system-ui,-apple-system,sans-serif;cursor:pointer}
.btn.o{background:#fff;color:var(--mag)}
.sm{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--mag);background:#fff;color:var(--mag);font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer}
label{font-size:14px;font-weight:600}
input,select,textarea{width:100%;min-height:48px;border:1px solid #B9C2B7;border-radius:10px;padding:0 12px;font:16px system-ui,-apple-system,sans-serif;margin:4px 0 12px;background:#fff}
textarea{min-height:90px;padding-top:10px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEF1EC;font-size:14px}
.r:last-child{border:0}
.s{margin:14px 20px 6px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
a{color:var(--mag)}
.back{background:none;border:0;color:var(--mag);font:600 15px system-ui,-apple-system,sans-serif;padding:14px 16px 0;min-height:44px;cursor:pointer}
.offer{background:var(--tint);border-color:#F2C19B}
#toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;display:none;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="stripe"></div>
<main id="app"></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient('https://sdhhzptvbkmeazrqkncw.supabase.co', 'sb_publishable_adna1O2TC3b99dIjxlU9Rw_SLvo8GYR');
const S = { ok: null, events: [], people: [], rows: [], view: 'list', id: null, edit: null };
const $ = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Europe/Bucharest';
const fD = d => new Intl.DateTimeFormat('ro-RO', { weekday: 'short', day: 'numeric', month: 'long', timeZone: TZ }).format(new Date(d));
const fT = d => new Intl.DateTimeFormat('ro-RO', { hour: '2-digit', minute: '2-digit', timeZone: TZ }).format(new Date(d));
const loc = iso => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 5000); };
const ev = () => S.events.find(e => e.id === S.id);

async function load() {
  if (S.ok !== true) return render();
  const q = [db.from('events').select('*').order('starts_at', { ascending: false }), db.from('profiles').select('id,first_name,last_name,email').order('first_name')];
  if (S.view === 'event') q.push(db.rpc('admin_event_signups', { p_event: S.id }));
  const [e, p, r] = await Promise.all(q);
  S.events = e.data || []; S.people = p.data || []; S.rows = (r && r.data) || [];
  render();
}

function render() {
  if (S.ok === null) return $.innerHTML = '<div class="top"><h1>Se încarcă…</h1></div>';
  if (S.ok === 'login') return $.innerHTML = '<div class="top"><h1>Admin</h1></div><div class="card"><p class="m">Intră mai întâi în aplicație cu contul tău.</p></div><a class="btn" href="index.html" style="text-decoration:none">Mergi la aplicație</a>';
  if (S.ok === false) return $.innerHTML = '<div class="top"><h1>Admin</h1></div><div class="card"><p class="m">Acest cont nu are drepturi de administrator.</p></div><a class="btn o" href="index.html" style="text-decoration:none">Înapoi</a>';
  $.innerHTML = S.view === 'form' ? formView() : S.view === 'event' ? eventView() : listView();
}

function listView() {
  const cards = S.events.map(e => {
    const past = new Date(e.ends_at) < new Date();
    return `<div class="card go" data-a="open" data-id="${e.id}"><b>${esc(e.title)}</b>
    <p class="m">${esc(fD(e.starts_at))} · ${fT(e.starts_at)}–${fT(e.ends_at)} · ${esc(e.location)}</p>
    <span class="tag">${e.confirmed_count + e.offered_count}/${e.capacity} locuri</span>${e.waitlist_count ? `<span class="tag">${e.waitlist_count} în așteptare</span>` : ''}
    ${e.status === 'cancelled' ? '<span class="tag g">Anulat</span>' : past ? '<span class="tag g">Încheiat</span>' : ''}</div>`;
  }).join('');
  return `<div class="top"><h1>Admin</h1><a href="index.html">Aplicația</a></div>
  <button class="btn" data-a="new">Eveniment nou</button>${cards || '<div class="card"><p class="m">Niciun eveniment încă.</p></div>'}`;
}

function field(id, label, val, type = 'text', extra = '') {
  return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}>`;
}

function formView() {
  const e = S.edit || {};
  return `<button class="back" data-a="${e.id ? 'open' : 'home'}" data-id="${e.id || ''}">‹ Înapoi</button>
  <div class="top"><h1>${e.id ? 'Editează evenimentul' : 'Eveniment nou'}</h1></div>
  <form data-f="event"><div class="card">
  ${field('title', 'Denumire', e.title, 'text', 'required')}
  ${field('st', 'Început', loc(e.starts_at), 'datetime-local', 'required')}
  ${field('en', 'Sfârșit', loc(e.ends_at), 'datetime-local', 'required')}
  ${field('loc', 'Locație', e.location, 'text', 'required')}
  ${field('map', 'Link hartă (opțional)', e.map_url, 'url')}
  <label for="desc">Descriere</label><textarea id="desc">${esc(e.description)}</textarea>
  ${field('cap', 'Număr de voluntari necesari', e.capacity, 'number', 'min="1" required')}
  ${field('cn', 'Persoană de contact', e.contact_name)}
  ${field('cp', 'Telefon contact', e.contact_phone, 'tel')}
  ${field('mp', 'Punct de întâlnire', e.meeting_point)}
  ${field('mt', 'Ora de întâlnire (opțional)', loc(e.meet_at), 'datetime-local')}
  <label for="po">Afiș (opțional, imagine)</label><input id="po" type="file" accept="image/*">
  ${e.poster_url ? `<p class="m" style="margin:-6px 0 8px">Are deja un afiș. Alege o imagine nouă doar dacă vrei să-l înlocuiești.</p>` : ''}</div>
  <button class="btn">${e.id ? 'Salvează modificările' : 'Publică evenimentul'}</button></form>`;
}

const LBL = { confirmed: 'Voluntar', offered: 'Loc rezervat', waitlist: 'Așteptare' };
function eventView() {
  const e = ev(); if (!e) return '<button class="back" data-a="home">‹ Înapoi</button>';
  const by = s => S.rows.filter(r => r.status === s);
  const taken = new Set(S.rows.filter(r => r.status === 'confirmed').map(r => r.user_id));
  const opts = S.people.filter(p => !taken.has(p.id)).map(p => `<option value="${p.id}">${esc(p.first_name + ' ' + p.last_name)} (${esc(p.email)})</option>`).join('');
  const rowsOf = (s, act) => by(s).map(r => `<div class="r"><span>${esc(r.full_name)}<br><span class="m">${esc(r.email)}${s === 'offered' ? ' · până la ' + fT(r.offer_expires_at) : ''}</span></span>${act(r)}</div>`).join('');
  const rm = r => `<button class="sm" data-a="rm" data-u="${r.user_id}">Scoate</button>`;
  const off = by('offered').map(r => `<div class="r"><span>${esc(r.full_name)}<br><span class="m">până la ${fT(r.offer_expires_at)}</span></span><button class="sm" data-a="skip" data-u="${r.user_id}">Treci peste</button></div>`).join('');
  return `<button class="back" data-a="home">‹ Toate evenimentele</button>
  <div class="top"><h1>${esc(e.title)}</h1></div>
  <div class="card"><p class="m" style="margin:0">${esc(fD(e.starts_at))} · ${fT(e.starts_at)}–${fT(e.ends_at)} · ${esc(e.location)}</p>
  <span class="tag">${e.confirmed_count + e.offered_count}/${e.capacity} locuri</span>${e.status === 'cancelled' ? '<span class="tag g">Anulat</span>' : ''}</div>
  <button class="btn" data-a="edit">Editează evenimentul</button>
  <button class="btn o" data-a="cancel">${e.status === 'cancelled' ? 'Reactivează evenimentul' : 'Anulează evenimentul'}</button>
  ${by('offered').length ? `<div class="s">Locuri rezervate (așteaptă confirmare)</div><div class="card offer">${off}
  <label for="to" style="margin-top:10px;display:block">Sau alege tu cine primește locul</label><select id="to">${opts}</select>
  <button class="sm" data-a="reassign">Dă locul persoanei alese</button></div>` : ''}
  <div class="s">Voluntari (${by('confirmed').length})</div><div class="card">${rowsOf('confirmed', rm) || '<p class="m">Nimeni încă.</p>'}</div>
  <div class="s">Listă de așteptare (${by('waitlist').length})</div><div class="card">${rowsOf('waitlist', rm) || '<p class="m">Nimeni în așteptare.</p>'}</div>
  <div class="s">Adaugă manual un voluntar</div><div class="card"><select id="add">${opts}</select><button class="sm" data-a="add">Adaugă ca voluntar</button></div>
  <button class="btn o" data-a="csv">Descarcă lista (Excel)</button>`;
}

async function rpc(fn, args) {
  const { error } = await db.rpc(fn, args);
  if (error) toast(error.message);
  await load();
}

function csv() {
  const e = ev(), q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['Nume', 'Email', 'Status'].map(q).join(';')].concat(S.rows.map(r => [r.full_name, r.email, LBL[r.status]].map(q).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = (e.title || 'lista').replace(/[^\w\-]+/g, '_') + '.csv'; a.click();
}

document.addEventListener('click', async x => {
  const el = x.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, u = el.dataset.u, val = id => document.getElementById(id)?.value;
  if (a === 'home') { S.view = 'list'; render(); }
  else if (a === 'new') { S.edit = null; S.view = 'form'; render(); }
  else if (a === 'open') { S.id = el.dataset.id; S.view = 'event'; S.rows = []; render(); load(); }
  else if (a === 'edit') { S.edit = ev(); S.view = 'form'; render(); }
  else if (a === 'cancel') {
    const e = ev(), to = e.status === 'cancelled' ? 'active' : 'cancelled';
    if (to === 'active' || confirm('Anulezi evenimentul? Sportivii nu îl vor mai vedea în listă.')) {
      const { error } = await db.from('events').update({ status: to }).eq('id', e.id); if (error) toast(error.message); load();
    }
  }
  else if (a === 'skip') await rpc('admin_skip_offer', { p_event: S.id, p_user: u });
  else if (a === 'rm' && confirm('Scoți persoana de pe eveniment?')) await rpc('admin_remove_signup', { p_event: S.id, p_user: u });
  else if (a === 'add' && val('add')) await rpc('admin_add_volunteer', { p_event: S.id, p_user: val('add') });
  else if (a === 'reassign' && val('to')) {
    const o = S.rows.find(r => r.status === 'offered');
    if (o) await rpc('admin_reassign_offer', { p_event: S.id, p_from: o.user_id, p_to: val('to') });
  }
  else if (a === 'csv') csv();
});

document.addEventListener('submit', async x => {
  x.preventDefault();
  const g = id => document.getElementById(id).value.trim(), iso = id => g(id) ? new Date(g(id)).toISOString() : null;
  const p = { title: g('title'), starts_at: iso('st'), ends_at: iso('en'), location: g('loc'), map_url: g('map') || null, description: g('desc') || null,
    capacity: parseInt(g('cap'), 10), contact_name: g('cn') || null, contact_phone: g('cp') || null, meeting_point: g('mp') || null, meet_at: iso('mt') };
  const file = document.getElementById('po').files[0];
  if (file) {
    if (file.size > 3e6) return toast('Imaginea e prea mare (maximum 3 MB).');
    const path = Date.now() + '-' + file.name.replace(/[^\w.\-]+/g, '_');
    const up = await db.storage.from('posters').upload(path, file);
    if (up.error) return toast('Afișul nu s-a încărcat: ' + up.error.message);
    p.poster_url = db.storage.from('posters').getPublicUrl(path).data.publicUrl;
  }
  const id = S.edit && S.edit.id;
  const { data, error } = id ? await db.from('events').update(p).eq('id', id).select().single() : await db.from('events').insert(p).select().single();
  if (error) return toast(error.message);
  S.id = data.id; S.view = 'event'; S.edit = null; toast('Salvat.'); load();
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { S.ok = 'login'; return render(); }
  const { data } = await db.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  S.ok = !!(data && data.is_admin); await load();
  if (S.ok) {
    let t; const later = () => { clearTimeout(t); t = setTimeout(load, 300); };
    db.channel('adm').on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, later)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'signups' }, later).subscribe();
  }
})();
</script>
</body>
</html>
